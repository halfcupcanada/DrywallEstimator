services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: drywall
      MYSQL_USER: drywall
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_APP_ID: ${VITE_APP_ID:-}
    image: drywall:local
    command: ["bash", "deploy/entrypoint.sh"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: mysql://drywall:${DB_PASSWORD}@db:3306/drywall
      JWT_SECRET: ${JWT_SECRET}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID}
      VITE_APP_ID: ${VITE_APP_ID:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE: ${SITE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dbdata:
  caddydata:
  caddyconfig:
